openapi: 3.0.3
info:
  title: SchoolDom API
  version: 1.0.0
  description: REST API for the SchoolDom school management platform - admin, teacher,
    student and parent dashboards, finance, attendance, exams, HR, the device fleet
    (kiosks/scanners), and the AI Secretary assistant. Generated directly from the
    live views/serializers, so it reflects exactly what is deployed.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: User login endpoint
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/exchange-impersonation/:
    post:
      operationId: auth_exchange_impersonation_create
      description: |-
        Trades a one-time "login as" code (minted only by a platform
        superadmin from the Control Panel - see control_panel.py's
        login_as_view) for a real signed-in session, with the exact same
        response shape login_view's success case returns so the frontend's
        existing post-login handling needs no impersonation-specific branch.

        This is a genuine authentication bypass by design (no password, no
        OTP, for support/debugging) - its only guardrails are the code itself
        (32 random bytes, works once, expires in 60s - deleted from the cache
        the instant it's looked up here, success or not) and the permanent
        audit trail below, which is silent to the impersonated user (no email,
        no notification, nothing in their own activity history) but never
        skipped.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: User registration endpoint
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/create-school/:
    post:
      operationId: auth_create_school_create
      description: Create school tenant and allocate non-conflicting schema/domain.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: User logout endpoint
      tags:
      - auth
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Get current user information
      tags:
      - auth
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Refresh access token
      tags:
      - auth
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/check-email/:
    get:
      operationId: auth_check_email_retrieve
      description: Check if email exists (for registration)
      tags:
      - auth
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/send-verification/:
    post:
      operationId: auth_send_verification_create
      description: Resend verification email
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: Verify email with verification code
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/admin/verify-otp/:
    post:
      operationId: auth_admin_verify_otp_create
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/admin/resend-otp/:
    post:
      operationId: auth_admin_resend_otp_create
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/admin/set-phone/:
    post:
      operationId: auth_admin_set_phone_create
      description: |-
        For an admin account that has no phone on file yet (the
        requires_phone_number response from login/signup/admin_verify_otp) -
        there's no session at this point to authenticate the request any other
        way, so this re-checks the password, then saves the phone and sends its
        OTP in one step.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/admin/verify-phone-otp/:
    post:
      operationId: auth_admin_verify_phone_otp_create
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/admin/resend-phone-otp/:
    post:
      operationId: auth_admin_resend_phone_otp_create
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        Request password reset: emails a 6-digit OTP code (not a link).
        Response shape is identical whether or not the account exists, so it
        can't be used to enumerate registered emails.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/password-reset/resend/:
    post:
      operationId: auth_password_reset_resend_create
      description: Resend a password reset OTP code.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Confirm password reset with the emailed OTP code.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/contact/:
    post:
      operationId: auth_contact_create
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: Change password for authenticated user
      tags:
      - auth
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/account/email/request-otp/:
    post:
      operationId: auth_account_email_request_otp_create
      description: |-
        Emails the signed-in user a one-time code at their CURRENT address
        before they're allowed to change the email they sign in with -
        unconditional, same as the finance subaccount settlement-change gate and
        branch_views.branch_request_delete_otp, because this protects account
        access itself, not just login.
      tags:
      - auth
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/account/email/:
    post:
      operationId: auth_account_email_create
      description: |-
        Change the email the signed-in user signs in with - password +
        emailed OTP required (see request_email_change_otp /
        _verify_email_change_step_up above). The code is sent to the CURRENT
        address, not the new one, so this can't be used to hijack an account by
        pointing it at an attacker-controlled inbox.
      tags:
      - auth
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/flutterwave/webhook/:
    post:
      operationId: finance_flutterwave_webhook_create
      description: Complete successful Flutterwave payments as soon as Flutterwave
        notifies us.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/kuda/webhook/:
    post:
      operationId: finance_kuda_webhook_create
      description: |-
        Complete successful Kuda payments as soon as Kuda notifies us.

        Security note: this webhook is intentionally NOT trusted for payment
        facts (amount/status) - it only uses the notification to learn WHICH
        reference to re-verify. The actual completion always goes through
        complete_payment_reference(reference) with no pre-built verification,
        so it falls through to a real verify_kuda_transaction() API call
        (mirrors flutterwave_webhook). This closes off forging a payment by
        POSTing a fabricated amount/status to this endpoint.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/finance/whatsapp/webhook/:
    get:
      operationId: finance_whatsapp_webhook_retrieve
      description: Central SchoolDom WhatsApp webhook for parent balance checks.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
    post:
      operationId: finance_whatsapp_webhook_create
      description: Central SchoolDom WhatsApp webhook for parent balance checks.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/finance/whatsapp/bahasha/webhook/:
    get:
      operationId: finance_whatsapp_bahasha_webhook_retrieve
      description: |-
        Bahasha WhatsApp webhook: delivery statuses and parents' replies.

        GET is Bahasha's one-time handshake (echo hub.challenge when the verify token
        matches). POST needs the shared ?token= secret. Bahasha retries when it does
        not get a fast 200, so message ids are de-duplicated before replying.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
    post:
      operationId: finance_whatsapp_bahasha_webhook_create
      description: |-
        Bahasha WhatsApp webhook: delivery statuses and parents' replies.

        GET is Bahasha's one-time handshake (echo hub.challenge when the verify token
        matches). POST needs the shared ?token= secret. Bahasha retries when it does
        not get a fast 200, so message ids are de-duplicated before replying.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/finance/whatsapp/reminders/run/:
    post:
      operationId: finance_whatsapp_reminders_run_create
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/bank-credit/webhook/:
    post:
      operationId: finance_bank_credit_webhook_create
      description: Receive NIBSS/Paystack/Moniepoint credit events and auto-match
        by narration.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/finance/wallet/:
    get:
      operationId: finance_wallet_retrieve
      description: Return the student's wallet, transactions, and fees.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/wallet/fund/:
    post:
      operationId: finance_wallet_fund_create
      description: Initialize school-fee payment for a student.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/wallet/verify/:
    post:
      operationId: finance_wallet_verify_create
      description: Verify Flutterwave payment and move the funds to the admin wallet.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/paystack/webhook/:
    post:
      operationId: finance_paystack_webhook_create
      description: Receive and process Paystack webhook events (charge.success).
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/finance/paystack/initialize/:
    post:
      operationId: finance_paystack_initialize_create
      description: |-
        Initialize a Paystack split payment for one or more school fees.

        Body: { "fee_ids": ["uuid", ...], "callback_url": "https://..." }
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/paystack/verify/:
    get:
      operationId: finance_paystack_verify_retrieve
      description: |-
        Verify a Paystack payment after redirect callback.

        Query: ?reference=PAY_xxx
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/paystack/breakdown/:
    post:
      operationId: finance_paystack_breakdown_create
      description: |-
        Return the fee breakdown a parent sees before paying.

        Body: { "fee_ids": ["uuid", ...] }
        Shows: student name, class, tuition, ₦100 Schooldom fee, ₦300 Paystack fee, total per fee.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/admin/test-sms/:
    post:
      operationId: finance_admin_test_sms_create
      description: Send a test SMS via Sendchamp and return the raw provider response.
        Finance admin only.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/admin/test-email/:
    post:
      operationId: finance_admin_test_email_create
      description: Send a test receipt email and return the result. Finance admin
        only.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/admin/paystack/banks/:
    get:
      operationId: finance_admin_paystack_banks_retrieve
      description: List Nigerian banks (name + settlement code) for the subaccount
        setup form. Finance roles only.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/admin/paystack/resolve-account/:
    get:
      operationId: finance_admin_paystack_resolve_account_retrieve
      description: Resolve a bank account number to its registered name via Paystack.
        Finance roles only.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/admin/paystack/split/setup/:
    post:
      operationId: finance_admin_paystack_split_setup_create
      description: |-
        Create - or, with password + emailed OTP, change - the Paystack
        subaccount that parents' split payments settle into.

        Body: { "account_number", "bank_code", "account_name" } always; plus
        "current_password", "otp_code", "otp_challenge" (from
        admin_subaccount_request_otp above) when a subaccount already exists -
        changing where live fee money settles needs both, creating the first one
        does not, since nothing is routed anywhere yet.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/admin/paystack/split/request-otp/:
    post:
      operationId: finance_admin_paystack_split_request_otp_create
      description: |-
        Emails the signed-in admin a one-time code before they're allowed to
        change the settlement bank account on an already-live Paystack
        subaccount. Unconditional - not gated by ADMIN_OTP_ENABLED or the
        admin-OTP email exemption list - because this protects where fee money
        gets routed, not just login.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/admin/paystack/split/status/:
    get:
      operationId: finance_admin_paystack_split_status_retrieve
      description: Get Paystack split payment configuration status for the school.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/transactions/:
    get:
      operationId: finance_transactions_retrieve
      description: |-
        Return Paystack split payment history for the authenticated parent.

        Query: ?page=1&limit=20&status=successful
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/transactions/{reference}/:
    get:
      operationId: finance_transactions_retrieve_2
      description: Return full detail for a single split payment transaction.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/parent/dashboard/:
    get:
      operationId: finance_parent_dashboard_retrieve
      description: |-
        Return a parent's full dashboard: virtual account, children fee summaries, and recent payments.
        Only accessible by the authenticated parent or finance/admin roles.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/admin/virtual-accounts/:
    get:
      operationId: finance_admin_virtual_accounts_retrieve
      description: List all parent virtual account assignments for this school (finance
        roles only).
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/admin/virtual-accounts/bulk-provision/:
    post:
      operationId: finance_admin_virtual_accounts_bulk_provision_create
      description: |-
        Provision Paystack virtual accounts for the guardians of several selected
        students in one request - the search-and-multi-select counterpart to
        admin_provision_paystack_virtual_account above. Finance roles only.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/admin/virtual-accounts/{parent_id}/:
    get:
      operationId: finance_admin_virtual_accounts_retrieve_2
      description: |-
        GET  – fetch current virtual account for a parent (returns null if none).
        POST/PUT – assign or update virtual account for a parent.
        DELETE – deactivate virtual account for a parent.
        Finance roles only.
      parameters:
      - in: path
        name: parent_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: finance_admin_virtual_accounts_destroy
      description: |-
        GET  – fetch current virtual account for a parent (returns null if none).
        POST/PUT – assign or update virtual account for a parent.
        DELETE – deactivate virtual account for a parent.
        Finance roles only.
      parameters:
      - in: path
        name: parent_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
    put:
      operationId: finance_admin_virtual_accounts_update
      description: |-
        GET  – fetch current virtual account for a parent (returns null if none).
        POST/PUT – assign or update virtual account for a parent.
        DELETE – deactivate virtual account for a parent.
        Finance roles only.
      parameters:
      - in: path
        name: parent_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: finance_admin_virtual_accounts_create
      description: |-
        GET  – fetch current virtual account for a parent (returns null if none).
        POST/PUT – assign or update virtual account for a parent.
        DELETE – deactivate virtual account for a parent.
        Finance roles only.
      parameters:
      - in: path
        name: parent_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/admin/virtual-accounts/{parent_id}/remind/:
    post:
      operationId: finance_admin_virtual_accounts_remind_create
      description: |-
        Send a fee statement email to a parent.
        Includes their virtual account details and outstanding fee balance per child.
        Finance roles only.
      parameters:
      - in: path
        name: parent_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/admin/virtual-accounts/{parent_id}/provision/:
    post:
      operationId: finance_admin_virtual_accounts_provision_create
      description: |-
        Auto-provision a real Paystack dedicated virtual account (DVA) for a parent, replacing the
        need to manually type in account details. Splits automatically to the school's subaccount.
        Finance roles only.
      parameters:
      - in: path
        name: parent_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/admin/parents/bulk-message/:
    post:
      operationId: finance_admin_parents_bulk_message_create
      description: |-
        Send bulk SMS / WhatsApp / Email to selected parents.
        Finance and admin roles only.
        Body: { parent_ids: [uuid...], channel: "sms"|"whatsapp"|"email", message: str }
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/admin/sms-wallet/:
    get:
      operationId: finance_admin_sms_wallet_retrieve
      description: SMS wallet balance + unit pricing + recent transactions for the
        admin's school.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/admin/sms-wallet/purchase/:
    post:
      operationId: finance_admin_sms_wallet_purchase_create
      description: |-
        Start a Paystack-funded SMS credit purchase. Body: { units: int } - must be a
        positive multiple of SMS_UNIT_BLOCK_SIZE.
      tags:
      - finance
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/finance/admin/sms-wallet/verify/{reference}/:
    post:
      operationId: finance_admin_sms_wallet_verify_create
      description: |-
        Verify a Paystack SMS bundle payment and credit the wallet (also self-heals if the
