                $ref: '#/components/schemas/InboundMessageDetail'
          description: ''
  /api/mail-inbox/messages/{id}/read/:
    post:
      operationId: mail_inbox_messages_read_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - mail-inbox
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/mail-inbox/messages/{id}/reply/:
    post:
      operationId: mail_inbox_messages_reply_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - mail-inbox
      security:
      - deviceTokenAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    InboundMessageDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        account_label:
          type: string
          maxLength: 50
        from_address:
          type: string
          maxLength: 255
        to_address:
          type: string
          maxLength: 255
        subject:
          type: string
          maxLength: 500
        body_text:
          type: string
        body_html:
          type: string
        received_at:
          type: string
          format: date-time
          nullable: true
        is_read:
          type: boolean
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/MailAttachment'
          readOnly: true
      required:
      - account_label
      - attachments
      - from_address
      - id
    InboundMessageList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        account_label:
          type: string
          maxLength: 50
        from_address:
          type: string
          maxLength: 255
        to_address:
          type: string
          maxLength: 255
        subject:
          type: string
          maxLength: 500
        received_at:
          type: string
          format: date-time
          nullable: true
        is_read:
          type: boolean
        has_attachments:
          type: string
          readOnly: true
      required:
      - account_label
      - from_address
      - has_attachments
      - id
    MailAttachment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        filename:
          type: string
          maxLength: 255
        file:
          type: string
          format: uri
        content_type:
          type: string
          maxLength: 100
      required:
      - file
      - filename
      - id
    PaginatedInboundMessageListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/InboundMessageList'
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    deviceTokenAuth:
      type: apiKey
      in: header
      name: X-Device-Token
      description: Permanent, non-expiring per-device token issued at kiosk/scanner
        provisioning (see device_fleet.views.device_provision and device_fleet.views.device_heartbeat).
        Used for a device's own work-calls instead of a human JWT session - see device_fleet.authentication.DeviceTokenAuthentication.
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from /api/token/ or /api/auth/login/ ("Authorization:
        Bearer <token>"). Branch-aware: a token carrying an active_tenant claim scopes
        the request to that branch instead of the user''s home tenant (see users.authentication.BranchAwareJWTAuthentication).'
