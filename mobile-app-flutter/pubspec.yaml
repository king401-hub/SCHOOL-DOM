name: schooldom_app
description: SchoolDom App - role-based mobile dashboard and attendance scanning for admins, teachers, and students.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # HTTP client
  http: ^1.2.2

  # Secure token storage (JWT tokens)
  flutter_secure_storage: ^9.2.2

  # Offline cache + queue (SharedPreferences)
  shared_preferences: ^2.3.2

  # Biometric unlock
  local_auth: ^2.3.0

  # GPS attendance
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Open attachment URLs in browser
  url_launcher: ^6.3.1

  # Camera and file picker (Settings)
  image_picker: ^1.1.2
  file_picker: ^11.0.3

  # QR / barcode camera scanner (SchoolDom Scanner attendance flows)
  mobile_scanner: ^7.0.1

  # Chat voice notes (record + playback)
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  video_player: ^2.14.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  http_parser: ^4.1.2
  connectivity_plus: ^7.3.1

  # NFC card reading + voice feedback (SchoolDom Scanner kiosk terminal mode)
  nfc_manager: ^3.5.0
  flutter_tts: ^4.2.0
  wakelock_plus: ^1.2.8
  battery_plus: ^6.2.1
  package_info_plus: ^8.1.2
  device_info_plus: ^11.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
