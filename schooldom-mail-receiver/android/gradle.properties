org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Longer timeouts + more retries for dependency downloads - this network has
# shown intermittent DNS/connection drops all session (git fetch, pub.dev
# checks), which killed the first two assembleDebug attempts outright rather
# than just slowing them down.
systemProp.http.socketTimeout=180000
systemProp.http.connectionTimeout=180000
systemProp.https.socketTimeout=180000
systemProp.https.connectionTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=1000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
